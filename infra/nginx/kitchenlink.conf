# =====================================================================
#  KitchenLink · Nginx (servidor web y proxy inverso) — pantalla 11
#    · Entrega el build estático de React (frontend/dist) a los dispositivos.
#    · Redirige /api (y /socket.io para tiempo real) a Express en 127.0.0.1:3000.
#    · HTTPS local con un certificado de mkcert.
#
#  Rutas a ajustar (marcadas con  <-- AJUSTA):
#    Windows: C:/kitchenlink/...   (diagonales normales, no invertidas)
#    Ubuntu:  /opt/kitchenlink/...
#  Ver docs/GUIA_ENTORNO.md, sección "Presentación con Nginx y HTTPS".
# =====================================================================

# Si usas el nginx.conf de Windows, copia solo los dos bloques "server"
# dentro del bloque "http { … }" de conf/nginx.conf.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;          # todo por HTTPS
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     C:/kitchenlink/infra/nginx/certs/kitchenlink.pem;       # <-- AJUSTA
    ssl_certificate_key C:/kitchenlink/infra/nginx/certs/kitchenlink-key.pem;   # <-- AJUSTA
    ssl_protocols TLSv1.2 TLSv1.3;

    # Build de React:  npm run build  (genera frontend/dist)
    root  C:/kitchenlink/frontend/dist;                                         # <-- AJUSTA
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # API REST -> Express
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Tiempo real (Socket.IO) -> Express. Se usará en comandas, cocina y barra.
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Archivos con huella en el nombre: se pueden guardar en caché mucho tiempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta (/iniciar-sesion, /cambiar-contrasena…) es index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
